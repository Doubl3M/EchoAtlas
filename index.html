<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EchoAtlas — Geographic World</title>
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            body {
                background: #ead9b4;
            }

            canvas {
                display: block;
                cursor: grab;
                touch-action: none;
            }

            canvas:active {
                cursor: grabbing;
            }

            header {
                position: fixed;
                top: 1.35rem;
                left: 1.5rem;
                color: #3f3025;
                font-family: Georgia, serif;
                pointer-events: none;
                padding: 0.7rem 0.9rem 0.65rem;
                background: rgb(234 217 180 / 78%);
                border: 1px solid rgb(83 59 42 / 24%);
                border-radius: 2px;
                box-shadow: 0 2px 10px rgb(70 45 30 / 10%);
            }

            .selection-card {
                position: fixed;
                right: 1.5rem;
                bottom: 1.5rem;
                width: min(19rem, calc(100vw - 3rem));
                box-sizing: border-box;
                padding: 1rem 1.15rem 1.1rem;
                color: #3d2d24;
                font-family: Georgia, serif;
                background: rgb(238 220 180 / 94%);
                border: 1px solid #76533a;
                border-radius: 48% 3px 44% 4px / 7px 42% 6px 38%;
                box-shadow:
                    0 5px 18px rgb(61 40 28 / 20%),
                    inset 0 0 0 3px rgb(255 245 211 / 35%);
            }

            .selection-card[hidden] {
                display: none;
            }

            .selection-card h2 {
                max-width: 15rem;
                margin: 0.18rem 0 0.8rem;
                font-size: 1.35rem;
                line-height: 1.12;
            }

            .selection-card__kind {
                margin: 0;
                color: #85563a;
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }

            .selection-card__close {
                position: absolute;
                top: 0.45rem;
                right: 0.55rem;
                width: 1.8rem;
                height: 1.8rem;
                padding: 0;
                color: #50372a;
                font:
                    1.35rem/1 Georgia,
                    serif;
                background: transparent;
                border: 0;
                cursor: pointer;
            }

            .selection-card dl {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 0.28rem 0.8rem;
                margin: 0;
                font-size: 0.82rem;
            }

            .selection-card dt {
                color: #76533a;
                font-style: italic;
            }

            .selection-card dd {
                margin: 0;
            }

            h1,
            p {
                margin: 0;
            }

            h1 {
                font-size: 1.6rem;
                font-weight: 600;
                letter-spacing: 0.055em;
            }

            p {
                margin-top: 0.3rem;
                font-size: 0.72rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <main id="app"></main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
