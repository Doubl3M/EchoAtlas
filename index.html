<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EchoAtlas — Geographic World</title>
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            body {
                background: #f1e2bd;
            }

            canvas {
                display: block;
                cursor: grab;
                touch-action: none;
            }

            canvas:active {
                cursor: grabbing;
            }

            header {
                position: fixed;
                top: 1.5rem;
                left: 1.75rem;
                color: #3f3025;
                font-family: Georgia, serif;
                pointer-events: none;
            }

            h1,
            p {
                margin: 0;
            }

            h1 {
                font-size: 1.75rem;
                letter-spacing: 0.04em;
            }

            p {
                margin-top: 0.3rem;
                font-size: 0.8rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <main id="app"></main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
